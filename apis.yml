aid: acevisiongroup
name: Ace Vision Group
description: 'Ace Vision Group, Inc. (AVG) is a Boston, Massachusetts based emerging
  medical laser device company founded in 2006 by vision scientist AnnMarie Hipsley,
  DPT, PhD. The company develops the VisioLite Er:YAG ophthalmic laser system and
  Laser Scleral Microporation (LSM), a non-contact therapeutic procedure intended to
  treat age-related eye dysfunction such as presbyopia by micro-porating the sclera
  to restore the eye''s natural dynamic range of focus. The VisioLite system remains
  under development and has not been approved or cleared for commercial sale in the
  United States, European Union, United Kingdom or other jurisdictions. Ace Vision
  Group publishes a four-page corporate website and operates no developer program,
  public API, SDK or machine-readable interface of any kind.'
